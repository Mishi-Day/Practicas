<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mau Meraky</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="icon" href="https://images.icon-icons.com/169/PNG/256/cat_halloween_23230.png">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Mau Meraky</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">¿Quiénes Somos?</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CAROUSEL -->
<div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://via.placeholder.com/1200x400" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="https://via.placeholder.com/1200x400/888" class="d-block w-100">
    </div>
  </div>
</div>

<!-- CONTENIDO -->
<div class="container mt-4">

  <h2>¿Quiénes Somos?</h2>
  <p>Somos una tienda de bijutería artesanal.</p>

  <h3>Productos</h3>
  <div class="row text-center">
    <div class="col-md-3">Anillos</div>
    <div class="col-md-3">Pulseras</div>
    <div class="col-md-3">Collares</div>
    <div class="col-md-3">Aretes</div>
  </div>

  <h3 class="mt-4">Servicios</h3>

  <div class="accordion" id="accordionExample">

    <div class="accordion-item">
      <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#s1">
        Pedidos especiales
      </button>
      <div id="s1" class="accordion-collapse collapse show">
        <div class="accordion-body">Hacemos pedidos personalizados</div>
      </div>
    </div>

    <div class="accordion-item">
      <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#s2">
        Entregas
      </button>
      <div id="s2" class="accordion-collapse collapse">
        <div class="accordion-body">Envíos y entregas</div>
      </div>
    </div>

  </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-4">
  <p>La Paz - Bolivia</p>
  <p>Email: mauMeraky@email.com</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
